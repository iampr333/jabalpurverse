description:
  en: Jilheri is named in festival-season lists along the Narmada trail west of the main city ghats. Roads and parking are not yet field-verified here — arrive with daylight, ask locally for the current approach, and do not assume boats or facilities.
  hi: जिल्हेरी मुख्य शहर घाटों के पश्चिम नर्मदा ट्रेल पर त्योहारी सूचियों में आता है। सड़क और पार्किंग यहाँ अभी ज़मीनी रूप से सत्यापित नहीं — दिन की रोशनी में पहुँचें, वर्तमान रास्ता स्थानीय रूप से पूछें, और नौका या सुविधाएँ मानकर न चलें।
