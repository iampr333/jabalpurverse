etiquette:
  en: Keep the steps clear for elders. Do not leave plastic near the water. Ask before photographing rituals.
  hi: बुज़ुर्गों के लिए सीढ़ियाँ खाली रखें। पानी के पास प्लास्टिक न छोड़ें। अनुष्ठान की फोटो से पहले अनुमति लें।
river_safety:
  en: Wet stone steps are slippery. Stay clear of deep water after dusk. Supervise children. Emergency — 112.
  hi: गीली पत्थर की सीढ़ियाँ फिसलन भरी होती हैं। संध्या के बाद गहरे पानी से दूर रहें। बच्चों पर नज़र रखें। आपातकाल — ११२।
