summary:
  en: Quiet Narmada ghat beside Gwarighat — rituals, river edge, and evening light. Confirm access and any festival notices locally.
  hi: ग्वारीघाट के पास शांत नर्मदा घाट — अनुष्ठान, नदी किनारा और संध्या प्रकाश। पहुँच और त्योहारी सूचनाएँ स्थानीय रूप से पुष्टि करें।
description:
  en: Uma Ghat sits next to the busier Gwarighat stretch — a calmer edge for personal rituals and watching the river turn gold at dusk. Steps and lighting change with the season; treat published notes as orientation until checked on the ground.
  hi: उमा घाट व्यस्त ग्वारीघाट के पास है — व्यक्तिगत अनुष्ठान और संध्या में नदी का सुनहरा रंग देखने के लिए शांत किनारा। सीढ़ियाँ और रोशनी मौसम के साथ बदलते हैं; प्रकाशित नोट्स को ज़मीनी जाँच तक केवल दिशा समझें।
