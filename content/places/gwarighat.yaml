etiquette:
  en: Dress modestly. Keep flower and diya waste out of the river where possible. Respect the Gurudwara and temple spaces. Do not film devotees without consent.
  hi: सादा वेश रखें। फूल और दीये का कचरा जहाँ संभव हो नदी में न डालें। गुरुद्वारा और मंदिर स्थानों का सम्मान करें। भक्तों की बिना अनुमति फिल्मांकन न करें।
river_safety:
  en: Slippery steps and strong currents. No swimming after dark. Keep children and elders close to the bank. Confirm boat status locally — festival days have closed main-ghat boats before. Emergency — 112.
  hi: फिसलन भरी सीढ़ियाँ और तेज़ धार। अँधेरे के बाद स्नान न करें। बच्चों और बुज़ुर्गों को किनारे के पास रखें। नौका की स्थिति स्थानीय रूप से पूछें — त्योहारों पर मुख्य घाट पर नावें बंद रही हैं। आपातकाल — ११२।
