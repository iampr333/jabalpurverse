summary:
  en: Main Narmada ghat for the evening Maha Aarti — about 9 km from Jabalpur Junction. Timing and boating must be confirmed locally.
  hi: सायंकालीन महा आरती का प्रमुख नर्मदा घाट — जबलपुर जंक्शन से लगभग ९ किमी। समय और नौका सेवा स्थानीय रूप से पुष्टि करें।
description:
  en: Gwarighat holds the daily Narmada Maha Aarti, temples including a half-submerged Maa Narmada shrine, Uma Ghat nearby, a Gurudwara, and seasonal fairs. Festival days can close boat operations — never assume boats are running.
  hi: ग्वारीघाट पर दैनिक नर्मदा महा आरती, आधी डूबी माँ नर्मदा की मूर्ति वाला मंदिर, पास उमा घाट, गुरुद्वारा और मौसमी मेले होते हैं। त्योहारों पर नौका बंद हो सकती है — कभी अनुमान न लगाएँ।
