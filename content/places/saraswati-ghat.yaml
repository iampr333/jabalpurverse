etiquette:
  en: Quiet respect at the water. Carry incense and flower waste away from the river when you can.
  hi: पानी पर शांत सम्मान। जहाँ संभव हो अगरबत्ती और फूल का कचरा नदी से दूर ले जाएँ।
river_safety:
  en: Watch for slippery moss on stone. Do not swim alone. Festival crowds need meeting points for families. Emergency — 112.
  hi: पत्थर पर फिसलन भरी काई से सावधान रहें। अकेले स्नान न करें। त्योहारी भीड़ में परिवारों के लिए मिलन बिंदु तय करें। आपातकाल — ११२।
