  en: Historic Narmada ghat area named in festival reports alongside Gwarighat and Tilwara. Use for orientation only until access details are verified.
  hi: ग्वारीघाट और तिलवारा के साथ त्योहारी रिपोर्टों में उल्लिखित ऐतिहासिक नर्मदा घाट क्षेत्र। पहुँच विवरण सत्यापित होने तक केवल दिशा के लिए।
description:
  en: Lameta appears with Gwarighat and Tilwara in Jayanti-season coverage as part of the city’s river circuit. Banks and access shift after rain — use this page to place the ghat on the trail, then confirm paths and any temporary closures locally.
  hi: लमेटा जयंती सीज़न की कवरेज में ग्वारीघाट और तिलवारा के साथ शहर के नदी सर्किट का हिस्सा है। बारिश के बाद किनारे और पहुँच बदलते हैं — इस पेज से घाट को ट्रेल पर रखें, फिर रास्ते और अस्थायी बंद स्थानीय रूप से पुष्टि करें।
