etiquette:
  en: Follow local guides on where bathing is customary. Leave no plastic near the steps.
  hi: स्नान कहाँ प्रथा है, स्थानीय मार्गदर्शन का पालन करें। सीढ़ियों के पास प्लास्टिक न छोड़ें।
river_safety:
  en: Banks can be steep and muddy after rain. Do not enter the current. Keep children inland of the last dry step. Emergency — 112.
  hi: बारिश के बाद किनारे ढलान वाले और कीचड़ भरे हो सकते हैं। धार में न उतरें। बच्चों को आखिरी सूखी सीढ़ी के अंदर रखें। आपातकाल — ११२।
