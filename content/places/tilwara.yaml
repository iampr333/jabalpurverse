etiquette:
  en: Give space to families performing rituals. Carry waste back. Avoid loud music at the water’s edge.
  hi: अनुष्ठान करने वाले परिवारों को जगह दें। कचरा वापस ले जाएँ। पानी के किनारे तेज़ संगीत से बचें।
river_safety:
  en: Crowds thicken on festival mornings. Watch your footing on uneven banks. Keep valuables secure. Emergency — 112.
  hi: त्योहारी सुबह भीड़ बढ़ती है। असमान किनारे पर सावधानी बरतें। सामान सुरक्षित रखें। आपातकाल — ११२।
